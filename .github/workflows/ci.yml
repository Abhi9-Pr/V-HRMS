name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Vespera.sln

      - name: Build (warnings as errors)
        run: dotnet build Vespera.sln --no-restore --configuration Release /warnaserror

      - name: Test
        run: dotnet test Vespera.sln --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  coverage-gate:
    # Line-coverage floor for the two layers where it matters most: Domain (pure business rules,
    # no infra deps — held to a high bar) and Application (orchestration/CQRS handlers — held to a
    # lower bar since a chunk of it is thin mapping/DTO code). Re-runs just these two test projects
    # with coverlet's collector (the only coverage package these test csproj files reference — see
    # docs/CONTRIBUTING-slices.md) and reads the Cobertura XML directly rather than trusting a
    # blended top-level number: the Application test run also loads Domain (its handlers construct
    # Domain types), so its per-assembly <package> line-rate is read explicitly instead of the
    # top-level <coverage> line-rate, which would otherwise dilute/inflate the Application figure.
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      DOMAIN_COVERAGE_GATE: "0.90"
      APPLICATION_COVERAGE_GATE: "0.80"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore Vespera.sln

      - name: Test Domain with coverage
        run: |
          dotnet test tests/Vespera.Domain.UnitTests/Vespera.Domain.UnitTests.csproj \
            --configuration Release --collect:"XPlat Code Coverage" \
            --results-directory TestResults/domain-coverage

      - name: Test Application with coverage
        run: |
          dotnet test tests/Vespera.Application.UnitTests/Vespera.Application.UnitTests.csproj \
            --configuration Release --collect:"XPlat Code Coverage" \
            --results-directory TestResults/application-coverage

      - name: Enforce coverage gates
        run: |
          set -euo pipefail

          domain_xml=$(find TestResults/domain-coverage -name coverage.cobertura.xml | head -1)
          domain_rate=$(grep -oE '<coverage line-rate="[0-9.]+"' "$domain_xml" | head -1 | sed -E 's/.*line-rate="([0-9.]+)"/\1/')
          domain_pct=$(awk -v r="$domain_rate" 'BEGIN { printf "%.2f", r * 100 }')
          echo "Domain line coverage: ${domain_pct}% (gate: $(awk -v g="$DOMAIN_COVERAGE_GATE" 'BEGIN { printf "%.0f", g * 100 }')%)"

          # Application test run also loads Domain (handlers construct Domain types), so the
          # top-level <coverage> figure would be blended — read the Vespera.Application <package>
          # node specifically for the real, undiluted Application-only number.
          app_xml=$(find TestResults/application-coverage -name coverage.cobertura.xml | head -1)
          app_rate=$(grep -oE '<package name="Vespera\.Application" line-rate="[0-9.]+"' "$app_xml" | sed -E 's/.*line-rate="([0-9.]+)"/\1/')
          app_pct=$(awk -v r="$app_rate" 'BEGIN { printf "%.2f", r * 100 }')
          echo "Application line coverage: ${app_pct}% (gate: $(awk -v g="$APPLICATION_COVERAGE_GATE" 'BEGIN { printf "%.0f", g * 100 }')%)"

          failed=0
          if ! awk -v r="$domain_rate" -v g="$DOMAIN_COVERAGE_GATE" 'BEGIN { exit !(r >= g) }'; then
            echo "::error::Domain line coverage ${domain_pct}% is below the required ${DOMAIN_COVERAGE_GATE} gate."
            failed=1
          fi
          if ! awk -v r="$app_rate" -v g="$APPLICATION_COVERAGE_GATE" 'BEGIN { exit !(r >= g) }'; then
            echo "::error::Application line coverage ${app_pct}% is below the required ${APPLICATION_COVERAGE_GATE} gate."
            failed=1
          fi
          exit $failed

      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            TestResults/domain-coverage
            TestResults/application-coverage

  security-scan:
    # Dependency + secret scanning. SAST lives in its own workflow (codeql.yml) since CodeQL's
    # own action manages triggers/scheduling differently from a plain job. Runs independently of
    # build-and-test (no `needs`) so a vulnerable/leaked dependency is reported even if the build
    # itself is red for an unrelated reason.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history, not just the checked-out commit

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore (.NET)
        run: dotnet restore Vespera.sln

      - name: Scan .NET dependencies for known vulnerabilities
        run: |
          dotnet list Vespera.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Vulnerable NuGet packages found — see the step output above."
            exit 1
          fi

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Scan npm dependencies for known vulnerabilities
        run: npm audit --audit-level=high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-push:
    # Builds both images on every push/PR (verification), and pushes to GHCR only on a push to
    # master — never for PRs, so an untrusted fork PR can never publish to the registry. Every
    # pushed image gets an immutable `sha-<short-sha>` tag; master pushes additionally get `edge`,
    # which `deploy-staging` below pulls. `packages: write` is scoped to just this job, using the
    # workflow's own GITHUB_TOKEN — no separate registry credential to manage.
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image vars
        id: vars
        run: |
          echo "registry_owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Vespera.Api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/vespera-api:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/vespera-api:edge

      - name: Build and push Client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Vespera.Client/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/vespera-client:${{ steps.vars.outputs.image_tag }}
            ghcr.io/${{ steps.vars.outputs.registry_owner }}/vespera-client:edge

  deploy-staging:
    # Stands up the exact images just pushed to GHCR via docker-compose.staging.yml — not a
    # rebuild, the same artifact security-scan and docker-build-push already validated — waits for
    # /health/ready (proves database/outbox/storage, not just process liveness), then runs the
    # fast curl-based smoke test followed by the full Playwright suite (Vespera.Client/e2e/)
    # against this live stack as the real end-to-end gate. Only runs on master pushes: PRs never
    # get a staging deploy, matching docker-build-push's own push gating.
    runs-on: ubuntu-latest
    needs: [build-and-test, coverage-gate, security-scan, docker-build-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: staging

    env:
      COMPOSE_PROJECT_NAME: vespera-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image vars
        id: vars
        run: |
          echo "registry_owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull staging images
        env:
          IMAGE_OWNER: ${{ steps.vars.outputs.registry_owner }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml pull db redis seq otel-collector api client

      - name: Start staging stack
        env:
          IMAGE_OWNER: ${{ steps.vars.outputs.registry_owner }}
          IMAGE_TAG: ${{ steps.vars.outputs.image_tag }}
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-build

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::API did not become ready in time"
          docker compose -f docker-compose.yml -f docker-compose.staging.yml logs api
          exit 1

      - name: Run smoke tests
        env:
          API_BASE_URL: http://localhost:8080
          CLIENT_BASE_URL: http://localhost:4200
        run: ./tools/smoke-test.sh

      - name: Install npm workspace dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Vespera.Client
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite against staging
        working-directory: Vespera.Client
        env:
          E2E_BASE_URL: http://localhost:4200
          E2E_API_BASE_URL: http://localhost:8080
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Publish Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Vespera.Client/playwright-report

      - name: Dump API logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml logs api

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.staging.yml down -v

  deploy-production:
    # The actual gate: `environment: production` only proceeds once a required reviewer approves
    # the run in GitHub's UI (configured in repo Settings → Environments → production — that
    # protection rule lives outside this file and has to be set up once by a repo admin). On
    # approval, promotes the *exact* image digest deploy-staging just smoke-tested/E2E-tested —
    # `imagetools create` copies the manifest, it does not rebuild — to the `production` and
    # `latest` tags. There's no cloud host wired up here (none exists yet): "production" means
    # this immutable, human-approved image family in GHCR; see docs/deployment.md for how a real
    # host pulls and runs it.
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute image vars
        id: vars
        run: |
          echo "registry_owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote staging-tested images to production
        env:
          OWNER: ${{ steps.vars.outputs.registry_owner }}
          TAG: ${{ steps.vars.outputs.image_tag }}
        run: |
          for image in vespera-api vespera-client; do
            docker buildx imagetools create \
              --tag "ghcr.io/${OWNER}/${image}:production" \
              --tag "ghcr.io/${OWNER}/${image}:latest" \
              "ghcr.io/${OWNER}/${image}:${TAG}"
          done

  payroll-performance-budget:
    # Performance regression guard for the payroll dry-run handler — the query path this whole
    # Performance phase started from (see docs/performance.md for the N+1 fixes and the real
    # query-translation bug the k6 load test found). One clean, uncontended dry-run sample
    # (ITERATIONS=1, vus=1 — see payroll-dry-run.js's own comment for why concurrency isn't used
    # here) against a small seeded cohort, thresholded against a generous budget derived from
    # real measurements. A regression here (e.g. a reintroduced N+1) fails CI instead of showing
    # up as a slow production payroll run.
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      COMPOSE_PROJECT_NAME: vespera-ci
      PAYROLL_DRY_RUN_BUDGET_MS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d --build db api seq otel-collector

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health/live > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error::API did not become healthy in time"
          docker compose logs api
          exit 1

      - name: Run payroll dry-run performance budget check
        run: |
          docker run --rm --network ${COMPOSE_PROJECT_NAME}_default \
            -v "${{ github.workspace }}/k6:/scripts" \
            -e BASE_URL=http://api:8080 \
            -e EMPLOYEE_COUNT=50 \
            -e ITERATIONS=1 \
            -e PAYROLL_DRY_RUN_BUDGET_MS=${PAYROLL_DRY_RUN_BUDGET_MS} \
            grafana/k6 run /scripts/payroll-dry-run.js

      - name: Dump API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Tear down
        if: always()
        run: docker compose down -v
