server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # environment.prod.ts sets apiBaseUrl: '' (same-origin) — the generated API client calls
    # relative /api/v1/... paths, which this reverse-proxies to the api container. Path is
    # forwarded unchanged because proxy_pass here has no URI component after the host:port.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (NotificationHub) needs the WebSocket upgrade headers; everything else on this
    # path is plain HTTP long-polling fallback, which proxy_http_version 1.1 also requires.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
