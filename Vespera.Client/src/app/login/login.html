<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Vespera HRMS</mat-card-title>
      <mat-card-subtitle>Sign in to continue</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Tenant ID</mat-label>
          <input matInput formControlName="tenantId" data-testid="tenantId" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" data-testid="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" data-testid="password" />
        </mat-form-field>

        @if (error()) {
          <p class="error" data-testid="error">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="loading()" data-testid="submit">
          @if (loading()) {
            <mat-spinner diameter="20"></mat-spinner>
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
