<div
  class="flex flex-col items-center gap-2 rounded border-2 border-dashed p-6 text-center transition-colors"
  [class.border-primary]="dragOver()"
  [class.border-border]="!dragOver()"
  (drop)="onDrop($event)"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
>
  <mat-icon class="text-text-muted">upload_file</mat-icon>
  <p class="text-sm text-text-muted">Drag files here, or</p>
  <button mat-stroked-button type="button" (click)="browse()">Browse files</button>
  <input #fileInput type="file" multiple hidden (change)="onFileInputChange($event)" />
</div>
