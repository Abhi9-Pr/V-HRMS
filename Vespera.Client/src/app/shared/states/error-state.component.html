<div class="flex flex-col items-center gap-2 py-12 text-center text-danger" role="alert">
  <mat-icon class="!h-10 !w-10 !text-4xl">{{ icon }}</mat-icon>
  <p class="text-base font-medium">{{ title }}</p>
  @if (description) {
    <p class="max-w-sm text-sm text-text-muted">{{ description }}</p>
  }
  <button mat-stroked-button color="warn" class="mt-2" (click)="action.emit()">{{ actionLabel }}</button>
</div>
