<div class="flex flex-col items-center gap-3 py-12 text-center text-danger" role="alert">
  <div class="flex h-16 w-16 items-center justify-center rounded-full bg-danger/10">
    <mat-icon class="!h-8 !w-8 !text-3xl">{{ icon }}</mat-icon>
  </div>
  <p class="text-base font-medium">{{ title }}</p>
  @if (description) {
    <p class="max-w-sm text-sm text-text-muted">{{ description }}</p>
  }
  <button mat-stroked-button color="warn" class="mt-2" (click)="action.emit()">{{ actionLabel }}</button>
</div>
