<div class="flex flex-col items-center gap-2 py-12 text-center text-text-muted">
  <mat-icon class="!h-10 !w-10 !text-4xl">{{ icon }}</mat-icon>
  <p class="text-base font-medium text-text">{{ title }}</p>
  @if (description) {
    <p class="max-w-sm text-sm">{{ description }}</p>
  }
  @if (actionLabel) {
    <button mat-stroked-button color="primary" class="mt-2" (click)="action.emit()">{{ actionLabel }}</button>
  }
</div>
