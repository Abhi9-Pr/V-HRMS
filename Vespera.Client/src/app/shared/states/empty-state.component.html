<div class="flex flex-col items-center gap-3 py-12 text-center text-text-muted">
  <div class="flex h-16 w-16 items-center justify-center rounded-full bg-surface-alt">
    <mat-icon class="!h-8 !w-8 !text-3xl text-text-muted">{{ icon }}</mat-icon>
  </div>
  <p class="text-base font-medium text-text">{{ title }}</p>
  @if (description) {
    <p class="max-w-sm text-sm">{{ description }}</p>
  }
  @if (actionLabel) {
    <button mat-stroked-button color="primary" class="mt-2" (click)="action.emit()">{{ actionLabel }}</button>
  }
</div>
