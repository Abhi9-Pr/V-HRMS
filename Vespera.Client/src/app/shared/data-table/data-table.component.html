@if (loading) {
  <mat-progress-bar mode="indeterminate" class="!rounded-t-lg" />
}

@if (!loading && rows.length === 0) {
  <div class="vespera-card">
    <vespera-empty-state icon="table_rows" title="No data" [description]="emptyLabel" />
  </div>
} @else {
  <div class="vespera-card overflow-hidden">
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="rows" matSort (matSortChange)="onSort($event)" class="w-full min-w-[480px]">
        @for (column of columns; track column.key) {
          <ng-container [matColumnDef]="column.key">
            <th
              mat-header-cell
              *matHeaderCellDef
              [mat-sort-header]="column.sortable ? column.key : ''"
              [disabled]="!column.sortable"
              class="!bg-surface-alt !text-xs !font-semibold !uppercase !tracking-wide !text-text-muted"
            >
              {{ column.header }}
            </th>
            <td mat-cell *matCellDef="let row" class="!text-sm">
              @if (column.cellTemplate) {
                <ng-container *ngTemplateOutlet="column.cellTemplate; context: { $implicit: row }" />
              } @else {
                {{ column.cell(row) }}
              }
            </td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:!bg-surface-alt/60"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalCount"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPage($event)"
      class="!border-t !border-border"
    />
  </div>
}
