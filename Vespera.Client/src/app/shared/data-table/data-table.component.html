@if (loading) {
  <mat-progress-bar mode="indeterminate" />
}

@if (!loading && rows.length === 0) {
  <vespera-empty-state icon="table_rows" title="No data" [description]="emptyLabel" />
} @else {
  <table mat-table [dataSource]="rows" matSort (matSortChange)="onSort($event)" class="w-full">
    @for (column of columns; track column.key) {
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef [mat-sort-header]="column.sortable ? column.key : ''" [disabled]="!column.sortable">
          {{ column.header }}
        </th>
        <td mat-cell *matCellDef="let row">
          @if (column.cellTemplate) {
            <ng-container *ngTemplateOutlet="column.cellTemplate; context: { $implicit: row }" />
          } @else {
            {{ column.cell(row) }}
          }
        </td>
      </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <mat-paginator
    [length]="totalCount"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPage($event)"
  />
}
