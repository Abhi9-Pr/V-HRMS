<h2 mat-dialog-title>New job requisition</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex flex-col gap-1">
    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>
    <vespera-form-error [control]="form.controls.title" />

    <mat-form-field appearance="outline">
      <mat-label>Department id</mat-label>
      <input matInput formControlName="departmentId" />
    </mat-form-field>
    <vespera-form-error [control]="form.controls.departmentId" />

    <mat-form-field appearance="outline">
      <mat-label>Openings</mat-label>
      <input matInput type="number" formControlName="openingsCount" />
    </mat-form-field>
    <vespera-form-error [control]="form.controls.openingsCount" />

    @if (error()) {
      <p class="text-sm text-danger" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">Create</button>
  </mat-dialog-actions>
</form>
