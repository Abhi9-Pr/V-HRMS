<div class="login-shell">
  <div class="login-aurora" aria-hidden="true">
    <span class="login-orb login-orb--a"></span>
    <span class="login-orb login-orb--b"></span>
    <span class="login-orb login-orb--c"></span>
    <span class="login-grid"></span>
  </div>

  <mat-card class="login-card w-full max-w-md p-4 !rounded-lg !shadow-2">
    <mat-card-header class="!pb-0">
      <mat-card-title class="!text-xl !font-semibold">Sign in</mat-card-title>
      <mat-card-subtitle class="!text-text-muted">Enter your credentials to continue</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3 pt-4">
        <mat-form-field appearance="outline">
          <mat-label>Tenant code</mat-label>
          <input matInput formControlName="tenantCode" autocomplete="organization" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (needsTotp()) {
          <mat-form-field appearance="outline">
            <mat-label>Authenticator code</mat-label>
            <input matInput formControlName="totpCode" autocomplete="one-time-code" />
          </mat-form-field>
        }

        @if (error()) {
          <p class="rounded-md bg-danger/10 px-3 py-2 text-sm text-danger" role="alert">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" class="!mt-1 !h-11" [disabled]="submitting()">
          @if (submitting()) {
            <mat-spinner diameter="20" class="inline-block align-middle" />
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
