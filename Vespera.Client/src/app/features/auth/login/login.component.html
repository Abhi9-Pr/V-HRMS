<div class="flex min-h-screen items-center justify-center bg-surface-alt px-4">
  <mat-card class="w-full max-w-sm p-2">
    <mat-card-header>
      <mat-card-title>Sign in to Vespera</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3 pt-4">
        <mat-form-field appearance="outline">
          <mat-label>Tenant code</mat-label>
          <input matInput formControlName="tenantCode" autocomplete="organization" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>

        @if (needsTotp()) {
          <mat-form-field appearance="outline">
            <mat-label>Authenticator code</mat-label>
            <input matInput formControlName="totpCode" autocomplete="one-time-code" />
          </mat-form-field>
        }

        @if (error()) {
          <p class="text-sm text-danger" role="alert">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
          @if (submitting()) {
            <mat-spinner diameter="20" class="inline-block align-middle" />
          } @else {
            Sign in
          }
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
