<div class="unused-seats-page">
  <h1>Unused Seats Report</h1>

  @if (loading()) {
    <mat-spinner diameter="32"></mat-spinner>
  } @else {
    <table mat-table [dataSource]="rows()" data-testid="unused-seats-table">
      <ng-container matColumnDef="productName">
        <th mat-header-cell *matHeaderCellDef>Product</th>
        <td mat-cell *matCellDef="let row">{{ row.productName }}</td>
      </ng-container>

      <ng-container matColumnDef="seatCount">
        <th mat-header-cell *matHeaderCellDef>Total Seats</th>
        <td mat-cell *matCellDef="let row">{{ row.seatCount }}</td>
      </ng-container>

      <ng-container matColumnDef="seatsUsed">
        <th mat-header-cell *matHeaderCellDef>Used</th>
        <td mat-cell *matCellDef="let row">{{ row.seatsUsed }}</td>
      </ng-container>

      <ng-container matColumnDef="unusedSeats">
        <th mat-header-cell *matHeaderCellDef>Unused</th>
        <td mat-cell *matCellDef="let row">{{ row.unusedSeats }}</td>
      </ng-container>

      <ng-container matColumnDef="expiresAt">
        <th mat-header-cell *matHeaderCellDef>Expires</th>
        <td mat-cell *matCellDef="let row">{{ row.expiresAt }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</div>
