<div class="asset-list-page">
  <div class="header">
    <h1>Assets</h1>
    <button mat-flat-button color="primary" (click)="newAsset()" data-testid="new-asset">New Asset</button>
  </div>

  @if (loading()) {
    <mat-spinner diameter="32"></mat-spinner>
  } @else {
    <table mat-table [dataSource]="assets()" data-testid="assets-table">
      <ng-container matColumnDef="assetTag">
        <th mat-header-cell *matHeaderCellDef>Tag</th>
        <td mat-cell *matCellDef="let asset">{{ asset.assetTag }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Category</th>
        <td mat-cell *matCellDef="let asset">{{ asset.category }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let asset">{{ statusLabel(asset.status) }}</td>
      </ng-container>

      <ng-container matColumnDef="serialNumber">
        <th mat-header-cell *matHeaderCellDef>Serial #</th>
        <td mat-cell *matCellDef="let asset">{{ asset.serialNumber }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let asset; columns: displayedColumns" (click)="openAsset(asset)" class="clickable-row"></tr>
    </table>

    <mat-paginator
      [length]="totalCount()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPage($event)">
    </mat-paginator>
  }
</div>
