<h2 mat-dialog-title>New asset</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex flex-col gap-1">
    <mat-form-field appearance="outline">
      <mat-label>Asset tag</mat-label>
      <input matInput formControlName="assetTag" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>
      <input matInput formControlName="category" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Purchase cost</mat-label>
      <input matInput type="number" formControlName="purchaseCost" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Currency</mat-label>
      <mat-select formControlName="purchaseCostCurrency">
        @for (currency of currencies; track currency) {
          <mat-option [value]="currency">{{ currencyLabel(currency) }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Purchase date</mat-label>
      <input matInput [matDatepicker]="purchaseDatePicker" formControlName="purchaseDate" />
      <mat-datepicker-toggle matIconSuffix [for]="purchaseDatePicker" />
      <mat-datepicker #purchaseDatePicker />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Serial number (optional)</mat-label>
      <input matInput formControlName="serialNumber" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>MAC address (optional)</mat-label>
      <input matInput formControlName="macAddress" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Warranty expiry (optional)</mat-label>
      <input matInput [matDatepicker]="warrantyPicker" formControlName="warrantyExpiryDate" />
      <mat-datepicker-toggle matIconSuffix [for]="warrantyPicker" />
      <mat-datepicker #warrantyPicker />
    </mat-form-field>

    @if (error()) {
      <p class="text-sm text-danger" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">Create</button>
  </mat-dialog-actions>
</form>
