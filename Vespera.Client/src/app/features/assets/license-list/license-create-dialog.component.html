<h2 mat-dialog-title>New license</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex flex-col gap-1">
    <mat-form-field appearance="outline">
      <mat-label>Product name</mat-label>
      <input matInput formControlName="productName" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Seat count</mat-label>
      <input matInput type="number" formControlName="seatCount" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Expires (optional)</mat-label>
      <input matInput [matDatepicker]="expiresPicker" formControlName="expiresAt" />
      <mat-datepicker-toggle matIconSuffix [for]="expiresPicker" />
      <mat-datepicker #expiresPicker />
    </mat-form-field>

    @if (error()) {
      <p class="text-sm text-danger" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">Create</button>
  </mat-dialog-actions>
</form>
