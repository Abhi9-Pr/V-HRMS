<div class="mb-4 flex items-center justify-between">
  <h1 class="text-xl font-semibold">Tickets</h1>
  <vespera-permission-button [permission]="Permissions.Helpdesk.RaiseTickets" variant="flat" (clicked)="openCreateDialog()">
    New ticket
  </vespera-permission-button>
</div>

@if (error(); as apiError) {
  <vespera-error-state [description]="apiError.message" (action)="reload()" />
} @else {
  <vespera-data-table
    [columns]="columns"
    [rows]="tickets()"
    [totalCount]="totalCount()"
    [loading]="loading()"
    emptyLabel="No tickets yet — raise the first one."
    (queryChange)="onQueryChange($event)"
  />
}

<ng-template #actionsCell let-ticket>
  <div class="flex justify-end">
    <vespera-permission-button [permission]="Permissions.Helpdesk.RaiseTickets" variant="icon" (clicked)="openTicket(ticket)">
      <mat-icon>chevron_right</mat-icon>
    </vespera-permission-button>
  </div>
</ng-template>
