<h2 mat-dialog-title>New SLA policy</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex flex-col gap-1">
    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Response time (hours)</mat-label>
      <input matInput type="number" formControlName="responseTimeHours" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Resolution time (hours)</mat-label>
      <input matInput type="number" formControlName="resolutionTimeHours" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Business hours start</mat-label>
      <input matInput type="time" formControlName="businessHoursStart" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Business hours end</mat-label>
      <input matInput type="time" formControlName="businessHoursEnd" />
    </mat-form-field>

    @if (error()) {
      <p class="text-sm text-danger" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()">Create</button>
  </mat-dialog-actions>
</form>
