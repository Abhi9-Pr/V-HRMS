<h2 mat-dialog-title>{{ data.approved ? 'Approve claim' : 'Reject claim' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Comment</mat-label>
      <textarea matInput formControlName="comment" rows="3"></textarea>
    </mat-form-field>

    @if (error()) {
      <p class="text-sm text-danger" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button [color]="data.approved ? 'primary' : 'warn'" type="submit" [disabled]="saving()">
      {{ data.approved ? 'Approve' : 'Reject' }}
    </button>
  </mat-dialog-actions>
</form>
