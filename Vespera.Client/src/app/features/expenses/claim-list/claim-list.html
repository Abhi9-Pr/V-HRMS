<div class="claim-list-page">
  <div class="header">
    <h1>My Expense Claims</h1>
    <button mat-flat-button color="primary" (click)="createClaim()" data-testid="new-claim">New Claim</button>
  </div>

  @if (loading()) {
    <mat-spinner diameter="32"></mat-spinner>
  } @else {
    <table mat-table [dataSource]="claims()" data-testid="claims-table">
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let claim">{{ statusLabel(claim.status) }}</td>
      </ng-container>

      <ng-container matColumnDef="settlementCurrency">
        <th mat-header-cell *matHeaderCellDef>Currency</th>
        <td mat-cell *matCellDef="let claim">{{ currencyLabel(claim.settlementCurrency) }}</td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let claim">{{ claim.total }}</td>
      </ng-container>

      <ng-container matColumnDef="lineCount">
        <th mat-header-cell *matHeaderCellDef>Lines</th>
        <td mat-cell *matCellDef="let claim">{{ claim.lines.length }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let claim; columns: displayedColumns" (click)="openClaim(claim)" class="clickable-row"></tr>
    </table>

    <mat-paginator
      [length]="totalCount()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPage($event)">
    </mat-paginator>
  }
</div>
