<div class="mb-4 flex items-center justify-between">
  <h1 class="text-xl font-semibold">My expense claims</h1>
  <vespera-permission-button [permission]="Permissions.Expenses.Submit" variant="flat" (clicked)="openCreateDialog()">
    New claim
  </vespera-permission-button>
</div>

@if (error(); as apiError) {
  <vespera-error-state [description]="apiError.message" (action)="reload()" />
} @else {
  <vespera-data-table
    [columns]="columns"
    [rows]="claims()"
    [totalCount]="totalCount()"
    [loading]="loading()"
    emptyLabel="No expense claims yet — create the first one."
    (queryChange)="onQueryChange($event)"
  />
}

<ng-template #actionsCell let-claim>
  <div class="flex justify-end">
    <vespera-permission-button [permission]="Permissions.Expenses.Submit" variant="icon" (clicked)="openClaim(claim)">
      <mat-icon>chevron_right</mat-icon>
    </vespera-permission-button>
  </div>
</ng-template>
