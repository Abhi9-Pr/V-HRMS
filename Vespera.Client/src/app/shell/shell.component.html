<mat-sidenav-container class="h-screen">
  <mat-sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="isMobile() ? sidenavOpened() : true"
    (closedStart)="onSidenavClosed()"
    class="!w-64 border-r border-border !bg-surface"
  >
    <vespera-sidenav (navigate)="onSidenavNavigate()" />
  </mat-sidenav>

  <mat-sidenav-content class="flex h-screen flex-col bg-surface-alt">
    <vespera-topbar (menuToggle)="toggleSidenav()" />
    <vespera-breadcrumb />
    <main class="flex-1 overflow-auto p-4 sm:p-6">
      <div class="vespera-page">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
