<mat-toolbar color="primary">
  <span>Vespera HRMS</span>
  <span class="spacer"></span>
  <button mat-button (click)="logout()" data-testid="logout">Sign out</button>
</mat-toolbar>

<mat-sidenav-container class="shell-container">
  <mat-sidenav mode="side" opened class="shell-nav">
    <mat-nav-list>
      <a mat-list-item routerLink="/expenses/claims" routerLinkActive="active-link">My Claims</a>
      <a mat-list-item routerLink="/expenses/approvals" routerLinkActive="active-link">Approvals</a>
      <a mat-list-item routerLink="/expenses/policies" routerLinkActive="active-link">Expense Policies</a>
      <a mat-list-item routerLink="/expenses/settlement" routerLinkActive="active-link">Settlement</a>
      <a mat-list-item routerLink="/assets" routerLinkActive="active-link">Assets</a>
      <a mat-list-item routerLink="/assets/licenses" routerLinkActive="active-link">Licenses</a>
      <a mat-list-item routerLink="/assets/licenses/unused-seats-report" routerLinkActive="active-link">Unused Seats</a>
      <a mat-list-item routerLink="/assets/recoveries" routerLinkActive="active-link">Asset Recoveries</a>
      <a mat-list-item routerLink="/assets/offboarding-checklist" routerLinkActive="active-link">Offboarding Checklist</a>
      <a mat-list-item routerLink="/assets/employee-exit" routerLinkActive="active-link">Record Exit</a>
      <a mat-list-item routerLink="/recruitment/requisitions" routerLinkActive="active-link">Requisitions</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
