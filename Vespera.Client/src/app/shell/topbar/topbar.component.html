<mat-toolbar class="!bg-surface border-b border-border">
  <button mat-icon-button (click)="menuToggle.emit()" aria-label="Toggle navigation">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="text-lg font-medium">Vespera</span>

  @if (tenantName) {
    <span class="ml-2 text-sm text-text-muted">{{ tenantName }}</span>
  }

  <span class="flex-1"></span>

  <button mat-icon-button (click)="toggleTheme()" aria-label="Toggle theme">
    <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="notificationsMenu" aria-label="Notifications">
    <mat-icon [matBadge]="notifications.unreadCount() || null" matBadgeColor="warn" matBadgeSize="small">
      notifications
    </mat-icon>
  </button>
  <mat-menu #notificationsMenu="matMenu">
    <button mat-menu-item (click)="notifications.markAllRead()">Mark all as read</button>
  </mat-menu>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="px-4 py-2 text-sm text-text-muted">{{ session()?.email }}</div>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Sign out</span>
    </button>
  </mat-menu>
</mat-toolbar>
