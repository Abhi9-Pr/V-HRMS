<div class="login-screen">
  <h1>Vespera</h1>

  @if (sessionTimedOut) {
    <p class="login-info" role="status">You were signed out after being inactive. Please sign in again.</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
    <label for="tenantCode">Tenant code</label>
    <input id="tenantCode" type="text" formControlName="tenantCode" autocomplete="organization" />

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />

    @if (needsTotp()) {
      <label for="totpCode">Authenticator code</label>
      <input id="totpCode" type="text" formControlName="totpCode" autocomplete="one-time-code" inputmode="numeric" />
    }

    @if (error()) {
      <p class="login-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
